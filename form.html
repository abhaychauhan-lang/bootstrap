<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap CSS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h2>form demo</h2>
        <form> 
            <div class="row">
                 <div class="mb-3 col-md-6">
                <label class="form-label" for="email">Email:</label>
            <input class="text" class="form-control" placeholder="email" id="email" />
            </div>
            <br>
            <div class="mb-3 col-md-6">
                <label class="form-label" for="password">Password:</label>
            <input class="password" class="form-control-sm" placeholder="password" id="password" />
            </div> 
            </div>
            <div class="mb-3">
                <select class="form-select-sm">
                    <option selected>select something</option>
                    <option value="1">one</option>
                    <option value="2">two</option>
                    <option value="3">three</option>
                </select>
            </div>
            <div class="mb-3 form-check">
                <label for="agreebs" class="form-check-label">Agree</label>
                <input type="checkbox" id="agreebs" class="form-check-input" />
            </div>
            <div class="mb-3 form-check">
                <label for="radiobs" class="form-check-label">YES/NO </label>
                <input type="radio" id="radiobs" class="form-check-input" />
            </div>
            <div class="form-check form-switch mb-3">
  <input class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault">
  <label class="form-check-label" for="switchCheckDefault">Default switch checkbox input</label>
</div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" ></script>
</body>
</html>
